services:
  - type: web
    name: assistci-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_SERVICE_URL
        value: http://localhost:8000
      - key: FILE_UPLOADS_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
